      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk vr-upside-down.apk

      - name: Publier l'APK dans Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: vr-upside-down.apk
