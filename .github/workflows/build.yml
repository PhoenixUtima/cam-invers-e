name: Build APK

# Ce fichier génère la config du projet Android puis compile l'APK.
# Les 2 fichiers Kotlin sont à ajouter dans app/src/main/java/com/example/vrupsidedown/
# Lancer : onglet Actions > Build APK > Run workflow
# L'APK est publié automatiquement dans l'onglet Releases (fichier .apk direct)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer le projet Android
        run: |
          mkdir -p app app/src/main app/src/main/res/layout app/src/main/res/values
          cat > settings.gradle.kts <<'__END__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VRUpsideDown"
          include(":app")
          __END__
          cat > build.gradle.kts <<'__END__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __END__
          cat > gradle.properties <<'__END__'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          __END__
          cat > app/build.gradle.kts <<'__END__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.vrupsidedown"
              compileSdk = 34

              defaultConfig {
                  applicationId = "net.vrenvers.cam"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 4
                  versionName = "1.3"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              val camerax = "1.3.4"
              implementation("androidx.camera:camera-core:$camerax")
              implementation("androidx.camera:camera-camera2:$camerax")
              implementation("androidx.camera:camera-lifecycle:$camerax")
          }
          __END__
          cat > app/src/main/AndroidManifest.xml <<'__END__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.VRUpsideDown">

                  <activity
                      android:name=".DiagActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Material.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
                      android:exported="false"
                      android:screenOrientation="sensorLandscape" />
              </application>
          </manifest>
          __END__
          cat > app/src/main/res/values/strings.xml <<'__END__'
          <resources>
              <string name="app_name">VR à l\'envers</string>
          </resources>
          __END__
          cat > app/src/main/res/values/themes.xml <<'__END__'
          <resources>
              <style name="Theme.VRUpsideDown" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          __END__
          cat > app/src/main/res/layout/activity_main.xml <<'__END__'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@android:color/black">

              <android.opengl.GLSurfaceView
                  android:id="@+id/glView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </FrameLayout>
          __END__

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

