name: Build APK

# Ce seul fichier génère tout le projet Android puis compile l'APK.
# Lancer : onglet Actions > Build APK > Run workflow
# APK dans Releases : créer une release avec un tag (ex. v1.1)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer le projet Android
        run: |
          mkdir -p app app/src/main app/src/main/java/com/example/vrupsidedown app/src/main/res/layout app/src/main/res/values
          cat > settings.gradle.kts <<'__END__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VRUpsideDown"
          include(":app")
          __END__
          cat > build.gradle.kts <<'__END__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __END__
          cat > gradle.properties <<'__END__'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          __END__
          cat > app/build.gradle.kts <<'__END__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.vrupsidedown"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.vrupsidedown"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 2
                  versionName = "1.1"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              val camerax = "1.3.4"
              implementation("androidx.camera:camera-core:$camerax")
              implementation("androidx.camera:camera-camera2:$camerax")
              implementation("androidx.camera:camera-lifecycle:$camerax")
          }
          __END__
          cat > app/src/main/AndroidManifest.xml <<'__END__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.VRUpsideDown">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          __END__
          cat > app/src/main/res/values/strings.xml <<'__END__'
          <resources>
              <string name="app_name">VR à l\'envers</string>
          </resources>
          __END__
          cat > app/src/main/res/values/themes.xml <<'__END__'
          <resources>
              <style name="Theme.VRUpsideDown" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          __END__
          cat > app/src/main/res/layout/activity_main.xml <<'__END__'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@android:color/black">

              <android.opengl.GLSurfaceView
                  android:id="@+id/glView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </FrameLayout>
          __END__
          cat > app/src/main/java/com/example/vrupsidedown/StereoRenderer.kt <<'__END__'
          package com.example.vrupsidedown

          import android.graphics.Bitmap
          import android.graphics.SurfaceTexture
          import android.opengl.GLES11Ext
          import android.opengl.GLES20
          import android.opengl.GLSurfaceView
          import android.opengl.GLUtils
          import android.opengl.Matrix
          import android.view.Surface
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicReference
          import javax.microedition.khronos.egl.EGLConfig
          import javax.microedition.khronos.opengles.GL10

          /**
           * Dessine la source (image/caméra = texture 2D, vidéo = texture externe OES)
           * deux fois côte à côte, avec :
           *  - correction de distorsion en barillet (pour les lentilles de casque)
           *  - réglage d'écart entre les images, zoom
           *  - retournement : 0 = 180° (à l'envers), 1 = miroir vertical, 2 = normal
           */
          class StereoRenderer(private val onVideoSurface: (Surface) -> Unit) : GLSurfaceView.Renderer {

              enum class Source { BITMAP, VIDEO }

              @Volatile var source = Source.BITMAP
              @Volatile var flipMode = 0
              @Volatile var distortion = 0.15f
              @Volatile var eyeShift = 0f
              @Volatile var zoom = 1f
              @Volatile var videoAspect = 16f / 9f
              @Volatile private var videoReady = false

              private val pendingBitmap = AtomicReference<Bitmap?>(null)
              private val frameAvailable = AtomicBoolean(false)
              private var lastBitmap: Bitmap? = null
              private var bitmapAspect = 4f / 3f
              private var hasBitmap = false

              private var progBitmap = 0
              private var progOes = 0
              private var texBitmap = 0
              private var texOes = 0
              private var surfaceTexture: SurfaceTexture? = null
              private var surface: Surface? = null
              private val texMatrix = FloatArray(16).also { Matrix.setIdentityM(it, 0) }

              private var viewW = 1
              private var viewH = 1

              private val quad = ByteBuffer.allocateDirect(8 * 4).order(ByteOrder.nativeOrder())
                  .asFloatBuffer().apply {
                      put(floatArrayOf(-1f, -1f, 1f, -1f, -1f, 1f, 1f, 1f))
                      position(0)
                  }

              /** Appelable depuis n'importe quel thread (caméra, décodage d'image). */
              fun submitBitmap(bmp: Bitmap) {
                  pendingBitmap.set(bmp)
              }

              fun resetVideo() {
                  videoReady = false
              }

              override fun onSurfaceCreated(gl: GL10?, config: EGLConfig?) {
                  GLES20.glClearColor(0f, 0f, 0f, 1f)
                  progBitmap = buildProgram(false)
                  progOes = buildProgram(true)

                  val t = IntArray(2)
                  GLES20.glGenTextures(2, t, 0)
                  texBitmap = t[0]
                  texOes = t[1]
                  setupTexture(GLES20.GL_TEXTURE_2D, texBitmap)
                  setupTexture(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, texOes)

                  surfaceTexture?.release()
                  surface?.release()
                  val st = SurfaceTexture(texOes)
                  st.setOnFrameAvailableListener { frameAvailable.set(true) }
                  surfaceTexture = st
                  surface = Surface(st)
                  videoReady = false
                  onVideoSurface(surface!!)

                  // Le contexte GL a été recréé : on renvoie la dernière image si besoin
                  hasBitmap = false
                  lastBitmap?.let { pendingBitmap.compareAndSet(null, it) }
              }

              override fun onSurfaceChanged(gl: GL10?, width: Int, height: Int) {
                  viewW = width
                  viewH = height
              }

              override fun onDrawFrame(gl: GL10?) {
                  GLES20.glViewport(0, 0, viewW, viewH)
                  GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT)

                  pendingBitmap.getAndSet(null)?.let { bmp ->
                      GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, texBitmap)
                      GLUtils.texImage2D(GLES20.GL_TEXTURE_2D, 0, bmp, 0)
                      bitmapAspect = bmp.width.toFloat() / bmp.height.toFloat()
                      lastBitmap = bmp
                      hasBitmap = true
                  }

                  if (frameAvailable.getAndSet(false)) {
                      try {
                          surfaceTexture?.updateTexImage()
                          surfaceTexture?.getTransformMatrix(texMatrix)
                          videoReady = true
                      } catch (e: Exception) {
                      }
                  }

                  val useVideo = source == Source.VIDEO
                  if (useVideo && !videoReady) return
                  if (!useVideo && !hasBitmap) return

                  val prog = if (useVideo) progOes else progBitmap
                  GLES20.glUseProgram(prog)

                  val aPos = GLES20.glGetAttribLocation(prog, "aPos")
                  GLES20.glEnableVertexAttribArray(aPos)
                  GLES20.glVertexAttribPointer(aPos, 2, GLES20.GL_FLOAT, false, 0, quad)

                  GLES20.glActiveTexture(GLES20.GL_TEXTURE0)
                  if (useVideo) GLES20.glBindTexture(GLES11Ext.GL_TEXTURE_EXTERNAL_OES, texOes)
                  else GLES20.glBindTexture(GLES20.GL_TEXTURE_2D, texBitmap)
                  GLES20.glUniform1i(GLES20.glGetUniformLocation(prog, "uTex"), 0)
                  GLES20.glUniformMatrix4fv(GLES20.glGetUniformLocation(prog, "uTexMatrix"), 1, false, texMatrix, 0)

                  val half = viewW / 2
                  val ae = half.toFloat() / viewH.toFloat()
                  val asp = if (useVideo) videoAspect else bitmapAspect
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(prog, "uAe"), ae)
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(prog, "uAs"), asp)
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(prog, "uK1"), distortion)
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(prog, "uK2"), distortion * 0.35f)
                  GLES20.glUniform1f(GLES20.glGetUniformLocation(prog, "uZoom"), zoom)
                  GLES20.glUniform1i(GLES20.glGetUniformLocation(prog, "uFlip"), flipMode)
                  val uShift = GLES20.glGetUniformLocation(prog, "uShift")

                  for (eye in 0..1) {
                      GLES20.glViewport(eye * half, 0, half, viewH)
                      // œil gauche : -shift, œil droit : +shift (positif = images rapprochées du centre)
                      GLES20.glUniform1f(uShift, if (eye == 0) -eyeShift else eyeShift)
                      GLES20.glDrawArrays(GLES20.GL_TRIANGLE_STRIP, 0, 4)
                  }
                  GLES20.glDisableVertexAttribArray(aPos)
              }

              private fun setupTexture(target: Int, tex: Int) {
                  GLES20.glBindTexture(target, tex)
                  GLES20.glTexParameteri(target, GLES20.GL_TEXTURE_MIN_FILTER, GLES20.GL_LINEAR)
                  GLES20.glTexParameteri(target, GLES20.GL_TEXTURE_MAG_FILTER, GLES20.GL_LINEAR)
                  GLES20.glTexParameteri(target, GLES20.GL_TEXTURE_WRAP_S, GLES20.GL_CLAMP_TO_EDGE)
                  GLES20.glTexParameteri(target, GLES20.GL_TEXTURE_WRAP_T, GLES20.GL_CLAMP_TO_EDGE)
              }

              private fun buildProgram(oes: Boolean): Int {
                  val ext = if (oes) "#extension GL_OES_EGL_image_external : require\n" else ""
                  val decl = if (oes) "uniform samplerExternalOES uTex;" else "uniform sampler2D uTex;"
                  val sample = if (oes)
                      "gl_FragColor = texture2D(uTex, (uTexMatrix * vec4(uv, 0.0, 1.0)).xy);"
                  else
                      "gl_FragColor = texture2D(uTex, vec2(uv.x, 1.0 - uv.y));"
                  val frag = ext + FRAG.replace("%DECL%", decl).replace("%SAMPLE%", sample)

                  val vs = compile(GLES20.GL_VERTEX_SHADER, VERT)
                  val fs = compile(GLES20.GL_FRAGMENT_SHADER, frag)
                  val p = GLES20.glCreateProgram()
                  GLES20.glAttachShader(p, vs)
                  GLES20.glAttachShader(p, fs)
                  GLES20.glLinkProgram(p)
                  val ok = IntArray(1)
                  GLES20.glGetProgramiv(p, GLES20.GL_LINK_STATUS, ok, 0)
                  if (ok[0] == 0) throw RuntimeException("Link: " + GLES20.glGetProgramInfoLog(p))
                  return p
              }

              private fun compile(type: Int, src: String): Int {
                  val s = GLES20.glCreateShader(type)
                  GLES20.glShaderSource(s, src)
                  GLES20.glCompileShader(s)
                  val ok = IntArray(1)
                  GLES20.glGetShaderiv(s, GLES20.GL_COMPILE_STATUS, ok, 0)
                  if (ok[0] == 0) throw RuntimeException("Shader: " + GLES20.glGetShaderInfoLog(s))
                  return s
              }

              companion object {
                  private const val VERT = """
          attribute vec2 aPos;
          varying vec2 vP;
          void main() {
              vP = aPos;
              gl_Position = vec4(aPos, 0.0, 1.0);
          }
          """

                  private const val FRAG = """
          precision highp float;
          varying vec2 vP;
          uniform float uAe;     // ratio d'aspect d'un oeil
          uniform float uAs;     // ratio d'aspect de la source
          uniform float uK1;
          uniform float uK2;
          uniform float uZoom;
          uniform float uShift;
          uniform int uFlip;
          uniform mat4 uTexMatrix;
          %DECL%
          void main() {
              float m = max(uAe, 1.0);
              vec2 pc = vP * vec2(uAe, 1.0) / m;
              float r2 = dot(pc, pc);
              vec2 pd = pc * (1.0 + uK1 * r2 + uK2 * r2 * r2);   // barillet
              vec2 ps = pd * m / vec2(uAe, 1.0);
              ps = ps / uZoom;
              ps.x += uShift;

              vec2 s;
              if (uAe > uAs) { s = vec2(ps.x * uAe / uAs, ps.y); }
              else           { s = vec2(ps.x, ps.y * uAs / uAe); }
              vec2 uv = s * 0.5 + 0.5;

              if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
                  gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
                  return;
              }
              if (uFlip == 0) { uv = vec2(1.0) - uv; }
              else if (uFlip == 1) { uv.y = 1.0 - uv.y; }
              %SAMPLE%
          }
          """
              }
          }
          __END__
          cat > app/src/main/java/com/example/vrupsidedown/MainActivity.kt <<'__END__'
          package com.example.vrupsidedown

          import android.Manifest
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.content.res.Configuration
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Matrix
          import android.media.ExifInterface
          import android.media.MediaPlayer
          import android.net.Uri
          import android.opengl.GLSurfaceView
          import android.os.Bundle
          import android.util.Size
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.Surface
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ImageAnalysis
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.core.content.ContextCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors
          import kotlin.math.max
          import kotlin.math.roundToInt

          /**
           * Vue VR (double image) à l'envers.
           * Sources : caméra arrière en direct, ou photo / vidéo importée depuis le téléphone.
           *
           * Toucher l'écran      : change l'orientation (180° / miroir vertical / normal)
           * Appui long           : réglages + choix de la source
           */
          class MainActivity : AppCompatActivity() {

              private lateinit var glView: GLSurfaceView
              private lateinit var renderer: StereoRenderer
              private lateinit var prefs: SharedPreferences
              private lateinit var cameraExecutor: ExecutorService

              private var cameraProvider: ProcessCameraProvider? = null
              private var analysis: ImageAnalysis? = null
              private var player: MediaPlayer? = null
              private var videoSurface: Surface? = null

              @Volatile
              private var cameraActive = false

              private val flipNames = arrayOf("À l'envers (180°)", "Miroir vertical", "Normal")

              private val permissionLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { granted ->
                      if (granted) startCamera()
                      else toast("Permission caméra refusée. Appui long pour importer une photo/vidéo.")
                  }

              private val picker =
                  registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                      if (uri != null) loadMedia(uri)
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  hideSystemBars()

                  prefs = getSharedPreferences("vr", MODE_PRIVATE)
                  cameraExecutor = Executors.newSingleThreadExecutor()

                  renderer = StereoRenderer { surface ->
                      runOnUiThread {
                          videoSurface = surface
                          try {
                              player?.setSurface(surface)
                          } catch (e: Exception) {
                          }
                      }
                  }
                  renderer.distortion = prefs.getFloat("k", 0.15f)
                  renderer.eyeShift = prefs.getFloat("shift", 0f)
                  renderer.zoom = prefs.getFloat("zoom", 1f)
                  renderer.flipMode = prefs.getInt("flip", 0)

                  glView = findViewById(R.id.glView)
                  glView.setEGLContextClientVersion(2)
                  glView.setRenderer(renderer)
                  glView.renderMode = GLSurfaceView.RENDERMODE_CONTINUOUSLY

                  val detector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onDown(e: MotionEvent?) = true
                      override fun onSingleTapConfirmed(e: MotionEvent?): Boolean {
                          cycleFlip()
                          return true
                      }

                      override fun onLongPress(e: MotionEvent?) {
                          showSettings()
                      }
                  })
                  glView.setOnTouchListener { _, e -> detector.onTouchEvent(e) }

                  useCamera()
                  toast("Toucher : orientation • Appui long : réglages / import")
              }

              // ---------------------------------------------------------------- sources

              private fun useCamera() {
                  stopPlayer()
                  renderer.source = StereoRenderer.Source.BITMAP
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                      == PackageManager.PERMISSION_GRANTED
                  ) startCamera()
                  else permissionLauncher.launch(Manifest.permission.CAMERA)
              }

              private fun startCamera() {
                  val providerFuture = ProcessCameraProvider.getInstance(this)
                  providerFuture.addListener({
                      val provider = providerFuture.get()
                      cameraProvider = provider

                      val a = ImageAnalysis.Builder()
                          .setTargetResolution(Size(800, 600))
                          .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                          .setOutputImageFormat(ImageAnalysis.OUTPUT_IMAGE_FORMAT_RGBA_8888)
                          .build()

                      a.setAnalyzer(cameraExecutor) { image ->
                          try {
                              if (!cameraActive) return@setAnalyzer
                              val src = image.toBitmap()
                              val rot = image.imageInfo.rotationDegrees
                              val bmp = if (rot == 0) src else {
                                  val m = Matrix().apply { postRotate(rot.toFloat()) }
                                  Bitmap.createBitmap(src, 0, 0, src.width, src.height, m, true)
                              }
                              renderer.submitBitmap(bmp)
                          } finally {
                              image.close()
                          }
                      }
                      analysis = a
                      cameraActive = true
                      provider.unbindAll()
                      provider.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, a)
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun stopCamera() {
                  cameraActive = false
                  cameraProvider?.unbindAll()
              }

              private fun loadMedia(uri: Uri) {
                  stopCamera()
                  stopPlayer()
                  val type = contentResolver.getType(uri) ?: ""
                  if (type.startsWith("video")) playVideo(uri) else showImage(uri)
              }

              private fun showImage(uri: Uri) {
                  cameraExecutor.execute {
                      val bmp = decodeBitmap(uri)
                      if (bmp == null) {
                          runOnUiThread { toast("Impossible de lire cette image") }
                      } else {
                          renderer.source = StereoRenderer.Source.BITMAP
                          renderer.submitBitmap(bmp)
                      }
                  }
              }

              private fun decodeBitmap(uri: Uri): Bitmap? {
                  return try {
                      val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                      contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
                      var sample = 1
                      while (max(bounds.outWidth, bounds.outHeight) / sample > 2048) sample *= 2

                      val opts = BitmapFactory.Options().apply { inSampleSize = sample }
                      val bmp = contentResolver.openInputStream(uri)?.use {
                          BitmapFactory.decodeStream(it, null, opts)
                      } ?: return null

                      val orientation = contentResolver.openInputStream(uri)?.use {
                          ExifInterface(it).getAttributeInt(
                              ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL
                          )
                      } ?: ExifInterface.ORIENTATION_NORMAL
                      val deg = when (orientation) {
                          ExifInterface.ORIENTATION_ROTATE_90 -> 90f
                          ExifInterface.ORIENTATION_ROTATE_180 -> 180f
                          ExifInterface.ORIENTATION_ROTATE_270 -> 270f
                          else -> 0f
                      }
                      if (deg == 0f) bmp
                      else Bitmap.createBitmap(
                          bmp, 0, 0, bmp.width, bmp.height, Matrix().apply { postRotate(deg) }, true
                      )
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun playVideo(uri: Uri) {
                  val surface = videoSurface
                  if (surface == null) {
                      toast("Surface vidéo pas prête, réessaie")
                      return
                  }
                  renderer.resetVideo()
                  renderer.source = StereoRenderer.Source.VIDEO
                  try {
                      player = MediaPlayer().apply {
                          setSurface(surface)
                          setDataSource(this@MainActivity, uri)
                          isLooping = true
                          setOnVideoSizeChangedListener { _, w, h ->
                              if (h > 0) renderer.videoAspect = w.toFloat() / h.toFloat()
                          }
                          setOnPreparedListener { it.start() }
                          setOnErrorListener { _, _, _ ->
                              toast("Impossible de lire cette vidéo")
                              true
                          }
                          prepareAsync()
                      }
                  } catch (e: Exception) {
                      toast("Impossible de lire cette vidéo")
                  }
              }

              private fun stopPlayer() {
                  try {
                      player?.release()
                  } catch (e: Exception) {
                  }
                  player = null
              }

              // --------------------------------------------------------------- réglages

              private fun cycleFlip() {
                  renderer.flipMode = (renderer.flipMode + 1) % flipNames.size
                  prefs.edit().putInt("flip", renderer.flipMode).apply()
                  toast(flipNames[renderer.flipMode])
              }

              private fun showSettings() {
                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                  }

                  fun slider(label: String, min: Float, maxV: Float, value: Float, onChange: (Float) -> Unit) {
                      col.addView(TextView(this).apply { text = label })
                      col.addView(SeekBar(this).apply {
                          max = 100
                          progress = ((value - min) / (maxV - min) * 100f).roundToInt().coerceIn(0, 100)
                          setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                              override fun onProgressChanged(sb: SeekBar?, p: Int, fromUser: Boolean) {
                                  if (fromUser) onChange(min + (maxV - min) * p / 100f)
                              }

                              override fun onStartTrackingTouch(sb: SeekBar?) {}
                              override fun onStopTrackingTouch(sb: SeekBar?) {}
                          })
                      })
                  }

                  slider("Correction de distorsion (lentilles)", 0f, 0.6f, renderer.distortion) {
                      renderer.distortion = it
                      prefs.edit().putFloat("k", it).apply()
                  }
                  slider("Rapprochement des deux images", -0.3f, 0.3f, renderer.eyeShift) {
                      renderer.eyeShift = it
                      prefs.edit().putFloat("shift", it).apply()
                  }
                  slider("Zoom", 0.5f, 2.5f, renderer.zoom) {
                      renderer.zoom = it
                      prefs.edit().putFloat("zoom", it).apply()
                  }

                  lateinit var dialog: AlertDialog

                  col.addView(Button(this).apply {
                      text = "Orientation : ${flipNames[renderer.flipMode]}"
                      setOnClickListener {
                          cycleFlip()
                          text = "Orientation : ${flipNames[renderer.flipMode]}"
                      }
                  })
                  col.addView(Button(this).apply {
                      text = "📷  Caméra en direct"
                      setOnClickListener {
                          dialog.dismiss()
                          useCamera()
                      }
                  })
                  col.addView(Button(this).apply {
                      text = "📂  Importer une photo / vidéo du téléphone"
                      setOnClickListener {
                          dialog.dismiss()
                          picker.launch(arrayOf("image/*", "video/*"))
                      }
                  })

                  dialog = AlertDialog.Builder(this)
                      .setTitle("Réglages")
                      .setView(ScrollView(this).apply { addView(col) })
                      .setPositiveButton("OK", null)
                      .create()
                  dialog.setOnDismissListener { hideSystemBars() }
                  dialog.show()
              }

              // ---------------------------------------------------------------- système

              private fun hideSystemBars() {
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior =
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  analysis?.targetRotation = window.decorView.display?.rotation ?: Surface.ROTATION_90
              }

              override fun onResume() {
                  super.onResume()
                  glView.onResume()
                  try {
                      player?.start()
                  } catch (e: Exception) {
                  }
              }

              override fun onPause() {
                  super.onPause()
                  try {
                      player?.pause()
                  } catch (e: Exception) {
                  }
                  glView.onPause()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  stopCamera()
                  stopPlayer()
                  cameraExecutor.shutdown()
              }

              private fun toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
          }
          __END__

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk vr-upside-down.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vr-upside-down-apk
          path: vr-upside-down.apk

      - name: Ajouter l'APK à la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: vr-upside-down.apk
